<svg viewBox="0 0 900 1020" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <title>TGE Warehouse PWA — System Architecture</title>

  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="reactGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#172a45"/>
    </linearGradient>
    <linearGradient id="swGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b1f5e"/>
      <stop offset="100%" stop-color="#2d1748"/>
    </linearGradient>
    <linearGradient id="laravelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#5c1515"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#0f3d21"/>
    </linearGradient>
    <linearGradient id="tierGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#5c2a0a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="1020" rx="12" fill="#0f172a"/>

  <!-- Title -->
  <rect x="20" y="16" width="860" height="56" rx="8" fill="url(#headerGrad)"/>
  <text x="450" y="50" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">TGE Warehouse PWA — System Architecture</text>
  <text x="880" y="50" text-anchor="end" fill="#64748b" font-size="12">Laravel 12 · Inertia · React · Workbox · Dexie</text>

  <!-- ═══════════ LAYER 1: FRONTEND (React + Inertia) ═══════════ -->
  <rect x="30" y="90" width="840" height="200" rx="10" fill="url(#reactGrad)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="50" y="118" fill="#60a5fa" font-size="15" font-weight="700">FRONTEND — React + Inertia.js</text>
  <text x="840" y="118" text-anchor="end" fill="#475569" font-size="11">Installable PWA on Android tablets</text>

  <!-- Component boxes -->
  <rect x="50" y="132" width="150" height="64" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="125" y="156" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">ScanWorkflow</text>
  <text x="125" y="174" text-anchor="middle" fill="#64748b" font-size="10">Barcode Detection API</text>
  <text x="125" y="186" text-anchor="middle" fill="#64748b" font-size="10">Camera + manual entry</text>

  <rect x="215" y="132" width="150" height="64" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="290" y="156" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">FreightDashboard</text>
  <text x="290" y="174" text-anchor="middle" fill="#64748b" font-size="10">Priority queue view</text>
  <text x="290" y="186" text-anchor="middle" fill="#64748b" font-size="10">Real-time via WebSocket</text>

  <rect x="380" y="132" width="150" height="64" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="455" y="156" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">LoadPlanView</text>
  <text x="455" y="174" text-anchor="middle" fill="#64748b" font-size="10">Bay assignments</text>
  <text x="455" y="186" text-anchor="middle" fill="#64748b" font-size="10">DG segregation rules</text>

  <rect x="545" y="132" width="150" height="64" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="620" y="156" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">PINAuth</text>
  <text x="620" y="174" text-anchor="middle" fill="#64748b" font-size="10">Tablet PIN login</text>
  <text x="620" y="186" text-anchor="middle" fill="#64748b" font-size="10">Role-based access</text>

  <rect x="710" y="132" width="150" height="64" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="785" y="156" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">ShiftReports</text>
  <text x="785" y="174" text-anchor="middle" fill="#64748b" font-size="10">Throughput metrics</text>
  <text x="785" y="186" text-anchor="middle" fill="#64748b" font-size="10">Exception logging</text>

  <!-- Inertia shared data bar -->
  <rect x="50" y="210" width="810" height="30" rx="5" fill="#0f2540" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="455" y="230" text-anchor="middle" fill="#60a5fa" font-size="11">Inertia Shared Data — auth.user · shift.current · sync.status · flash messages</text>

  <!-- Sync status bar -->
  <rect x="50" y="250" width="810" height="26" rx="5" fill="#0c1e36" stroke="#1e40af" stroke-width="1"/>
  <text x="455" y="268" text-anchor="middle" fill="#3b82f6" font-size="11">SyncStatusProvider (React Context) — online/offline indicator · queue depth · last sync timestamp</text>

  <!-- Arrow down -->
  <polygon points="450,294 440,290 460,290" fill="#8b5cf6"/>
  <line x1="450" y1="290" x2="450" y2="304" stroke="#8b5cf6" stroke-width="2"/>

  <!-- ═══════════ LAYER 2: SERVICE WORKER + OFFLINE ═══════════ -->
  <rect x="30" y="304" width="840" height="155" rx="10" fill="url(#swGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="50" y="332" fill="#a78bfa" font-size="15" font-weight="700">SERVICE WORKER — Workbox + Dexie.js</text>
  <text x="840" y="332" text-anchor="end" fill="#475569" font-size="11">Offline-first outbox pattern</text>

  <rect x="50" y="346" width="185" height="55" rx="6" fill="#2d1748" stroke="#7c3aed" stroke-width="1"/>
  <text x="142" y="368" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">Workbox Precaching</text>
  <text x="142" y="384" text-anchor="middle" fill="#64748b" font-size="10">App shell + static assets</text>

  <rect x="250" y="346" width="185" height="55" rx="6" fill="#2d1748" stroke="#7c3aed" stroke-width="1"/>
  <text x="342" y="368" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">Workbox Runtime</text>
  <text x="342" y="384" text-anchor="middle" fill="#64748b" font-size="10">NetworkFirst for API routes</text>

  <rect x="450" y="346" width="185" height="55" rx="6" fill="#2d1748" stroke="#7c3aed" stroke-width="1"/>
  <text x="542" y="368" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">Dexie.js (IndexedDB)</text>
  <text x="542" y="384" text-anchor="middle" fill="#64748b" font-size="10">Local scan + freight cache</text>

  <rect x="650" y="346" width="210" height="55" rx="6" fill="#2d1748" stroke="#7c3aed" stroke-width="1"/>
  <text x="755" y="368" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">Background Sync Queue</text>
  <text x="755" y="384" text-anchor="middle" fill="#64748b" font-size="10">Outbox → retry on reconnect</text>

  <!-- Sync flow label -->
  <rect x="50" y="414" width="810" height="30" rx="5" fill="#1a0e30" stroke="#6d28d9" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="455" y="434" text-anchor="middle" fill="#a78bfa" font-size="11">Offline: write to Dexie outbox → Online: Background Sync drains queue → POST to Laravel API → confirm + clear</text>

  <!-- Arrow down -->
  <polygon points="450,463 440,459 460,459" fill="#ef4444"/>
  <line x1="450" y1="459" x2="450" y2="473" stroke="#ef4444" stroke-width="2"/>

  <!-- ═══════════ LAYER 3: LARAVEL BACKEND ═══════════ -->
  <rect x="30" y="473" width="840" height="200" rx="10" fill="url(#laravelGrad)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="50" y="501" fill="#fca5a5" font-size="15" font-weight="700">BACKEND — Laravel 12 API</text>
  <text x="840" y="501" text-anchor="end" fill="#475569" font-size="11">PHP 8.3 · Services · Events · Queues · Policies</text>

  <rect x="50" y="515" width="155" height="64" rx="6" fill="#5c1515" stroke="#dc2626" stroke-width="1"/>
  <text x="127" y="539" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">ScanController</text>
  <text x="127" y="555" text-anchor="middle" fill="#7f7f7f" font-size="10">Validate + store scans</text>
  <text x="127" y="567" text-anchor="middle" fill="#7f7f7f" font-size="10">Conflict detection</text>

  <rect x="220" y="515" width="155" height="64" rx="6" fill="#5c1515" stroke="#dc2626" stroke-width="1"/>
  <text x="297" y="539" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">FreightService</text>
  <text x="297" y="555" text-anchor="middle" fill="#7f7f7f" font-size="10">Tier classification</text>
  <text x="297" y="567" text-anchor="middle" fill="#7f7f7f" font-size="10">Priority scoring</text>

  <rect x="390" y="515" width="155" height="64" rx="6" fill="#5c1515" stroke="#dc2626" stroke-width="1"/>
  <text x="467" y="539" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">EventDispatcher</text>
  <text x="467" y="555" text-anchor="middle" fill="#7f7f7f" font-size="10">FreightScanned</text>
  <text x="467" y="567" text-anchor="middle" fill="#7f7f7f" font-size="10">PriorityEscalated</text>

  <rect x="560" y="515" width="155" height="64" rx="6" fill="#5c1515" stroke="#dc2626" stroke-width="1"/>
  <text x="637" y="539" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">QueueWorker</text>
  <text x="637" y="555" text-anchor="middle" fill="#7f7f7f" font-size="10">ProcessScan job</text>
  <text x="637" y="567" text-anchor="middle" fill="#7f7f7f" font-size="10">NotifyEscalation job</text>

  <rect x="730" y="515" width="130" height="64" rx="6" fill="#5c1515" stroke="#dc2626" stroke-width="1"/>
  <text x="795" y="539" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">Policies</text>
  <text x="795" y="555" text-anchor="middle" fill="#7f7f7f" font-size="10">ScanPolicy</text>
  <text x="795" y="567" text-anchor="middle" fill="#7f7f7f" font-size="10">ShiftPolicy</text>

  <!-- Laravel patterns bar -->
  <rect x="50" y="593" width="810" height="26" rx="5" fill="#3f0d0d" stroke="#991b1b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="455" y="611" text-anchor="middle" fill="#fca5a5" font-size="11">Observers · FormRequests · Resources · Middleware (shift auth) · Scheduled Commands (priority decay)</text>

  <!-- WebSocket bar -->
  <rect x="50" y="630" width="810" height="28" rx="5" fill="#450a0a" stroke="#b91c1c" stroke-width="1"/>
  <text x="455" y="649" text-anchor="middle" fill="#f87171" font-size="11">Laravel Reverb (WebSocket) — broadcasts FreightUpdated · ScanConfirmed · PriorityChanged to React frontend</text>

  <!-- Arrow down -->
  <polygon points="450,678 440,674 460,674" fill="#22c55e"/>
  <line x1="450" y1="674" x2="450" y2="688" stroke="#22c55e" stroke-width="2"/>

  <!-- ═══════════ LAYER 4: DATABASE ═══════════ -->
  <rect x="30" y="688" width="520" height="120" rx="10" fill="url(#dbGrad)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="50" y="716" fill="#86efac" font-size="15" font-weight="700">DATABASE — MySQL 8</text>

  <rect x="50" y="730" width="115" height="40" rx="5" fill="#0f3d21" stroke="#16a34a" stroke-width="1"/>
  <text x="107" y="755" text-anchor="middle" fill="#86efac" font-size="11">freight_items</text>

  <rect x="175" y="730" width="90" height="40" rx="5" fill="#0f3d21" stroke="#16a34a" stroke-width="1"/>
  <text x="220" y="755" text-anchor="middle" fill="#86efac" font-size="11">scans</text>

  <rect x="275" y="730" width="90" height="40" rx="5" fill="#0f3d21" stroke="#16a34a" stroke-width="1"/>
  <text x="320" y="755" text-anchor="middle" fill="#86efac" font-size="11">users</text>

  <rect x="375" y="730" width="80" height="40" rx="5" fill="#0f3d21" stroke="#16a34a" stroke-width="1"/>
  <text x="415" y="755" text-anchor="middle" fill="#86efac" font-size="11">shifts</text>

  <rect x="465" y="730" width="75" height="40" rx="5" fill="#0f3d21" stroke="#16a34a" stroke-width="1"/>
  <text x="502" y="755" text-anchor="middle" fill="#86efac" font-size="11">bays</text>

  <text x="50" y="798" fill="#4ade80" font-size="10">UUIDv7 primary keys · soft deletes · shift_id scoping · composite indexes on (connote, scanned_at)</text>

  <!-- ═══════════ LAYER 4b: PRIORITY ENGINE ═══════════ -->
  <rect x="570" y="688" width="300" height="120" rx="10" fill="url(#tierGrad)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="590" y="716" fill="#fcd34d" font-size="15" font-weight="700">PRIORITY ENGINE</text>

  <rect x="590" y="730" width="60" height="40" rx="5" fill="#92400e" stroke="#d97706" stroke-width="1.5"/>
  <text x="620" y="746" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">T1</text>
  <text x="620" y="762" text-anchor="middle" fill="#fbbf24" font-size="9">DG/HAZ</text>

  <rect x="658" y="730" width="60" height="40" rx="5" fill="#92400e" stroke="#d97706" stroke-width="1.5"/>
  <text x="688" y="746" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">T2</text>
  <text x="688" y="762" text-anchor="middle" fill="#fbbf24" font-size="9">FRAGILE</text>

  <rect x="726" y="730" width="60" height="40" rx="5" fill="#92400e" stroke="#d97706" stroke-width="1.5"/>
  <text x="756" y="746" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">T3</text>
  <text x="756" y="762" text-anchor="middle" fill="#fbbf24" font-size="9">BULK</text>

  <rect x="794" y="730" width="60" height="40" rx="5" fill="#92400e" stroke="#d97706" stroke-width="1.5"/>
  <text x="824" y="746" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">T4</text>
  <text x="824" y="762" text-anchor="middle" fill="#fbbf24" font-size="9">LOW</text>

  <text x="590" y="798" fill="#fcd34d" font-size="10">ADG Code rules · time-decay scoring · scheduled reclass via artisan</text>

  <!-- ═══════════ LAYER 5: DEPLOYMENT ═══════════ -->
  <rect x="30" y="825" width="840" height="55" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="50" y="856" fill="#a5b4fc" font-size="15" font-weight="700">DEPLOYMENT</text>
  <text x="220" y="856" fill="#64748b" font-size="12">Hetzner VPS → Coolify → GitHub push-to-deploy → nixpacks.toml → Laravel Reverb + queue worker</text>

  <!-- ═══════════ FOOTER ═══════════ -->
  <rect x="30" y="900" width="840" height="100" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="50" y="928" fill="#94a3b8" font-size="13" font-weight="600">Key Laravel Patterns Exercised</text>
  <text x="50" y="950" fill="#64748b" font-size="11">Services (FreightService, ScanService) · Events + Listeners (FreightScanned → ClassifyPriority) · Observers (FreightItemObserver)</text>
  <text x="50" y="968" fill="#64748b" font-size="11">FormRequests (StoreScanRequest) · API Resources (FreightResource) · Policies (ScanPolicy) · Queued Jobs (ProcessScan)</text>
  <text x="50" y="986" fill="#64748b" font-size="11">Scheduled Commands (priority:recalculate) · Middleware (EnsureActiveShift) · Broadcasting (FreightUpdated event)</text>
</svg>